  <!-- ===== VIDEO MODAL ===== -->
  <div class="modal-overlay" id="videoModal" data-video-id="{{video.id}}" aria-hidden="true">
    <div class="modal-dialog">
      <button class="modal-close-btn" id="closeModal" aria-label="{{video.closeLabel}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <div class="modal-video-frame">
        <iframe id="videoIframe" src="" title="{{video.title}}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
    </div>
  </div>
