    <!-- ===== WHY DO YOU NEED IT / CLOSE PROJECTS (GSAP parallax) ===== -->
    <section class="mm-block" id="make-money">
      <div class="mm-wrap">
      <svg class="svg-filters" width="0" height="0" aria-hidden="true">
        <!-- Directional blur for background ₹500 note -->
        <filter id="mm-motion-x" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="5 0.4" />
        </filter>

        <!-- Speed blur filter for left (trailing) end of ₹200 note -->
        <filter id="mm-speed-left" x="-40%" y="-10%" width="150%" height="120%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="9 0.3" result="b"/>
          <feOffset in="b" dx="-10" dy="0"/>
        </filter>
      </svg>
        <section class="mm-section" id="mm-section">


          <!-- Section-level houses (outside stage) -->
          <img class="float blur-md h2-large" src="{{root}}assets/make-money/house.png" alt="" aria-hidden="true" data-group="h2-large" data-speed="0.6" data-rot="-14">
          <img class="float shadow-neutral h3-small" src="{{root}}assets/make-money/house.png" alt="" aria-hidden="true" data-group="h3-small" data-speed="0.4" data-rot="6">
          <img class="float blur-lg h4-large" src="{{root}}assets/make-money/house.png" alt="" aria-hidden="true" data-group="h4-large" data-speed="1.8" data-rot="-10">

          <!-- Clean H2 Heading (z-index: 4, nothing covers it) -->
          <h2 class="mm-title">{{closeprojects.title}}</h2>

          <!-- Stage Container (NO z-index or transform) -->
          <div class="mm-stage">

            <!-- Stage Radial Glow & Concentric Elliptical Rings -->
            <div class="stage-glow" aria-hidden="true"></div>
            <div class="ring ring-1" aria-hidden="true"></div>
            <div class="ring ring-2" aria-hidden="true"></div>

            <!-- Z-INDEX 1: Behind Text Objects -->
            <img class="float note-500 shadow-motion-500" src="{{root}}assets/make-money/note-500.png" alt="" aria-hidden="true" data-group="n500" data-speed="0.5" data-rot="-18">
            <img class="float coin coin-1 shadow-neutral" src="{{root}}assets/make-money/coin.png" alt="" aria-hidden="true" data-group="c1" data-speed="0.6" data-rot="-12">
            <img class="float stage-house shadow-neutral" src="{{root}}assets/make-money/house.png" alt="" aria-hidden="true" data-group="shouse" data-speed="0.35" data-rot="8">

            <!-- ₹200 NOTE BACK LAYER (Z-Index 1: Under text) -->
            <!-- 1. Back Blurred Copy -->
            <img class="float note-200 n200-back-blur" src="{{root}}assets/make-money/note-200.png" alt="" aria-hidden="true" data-group="n200" data-speed="1.6" data-rot="-8">
            <!-- 2. Back Sharp Copy (masked to fade out left edge) -->
            <img class="float note-200 n200-back-sharp sharp-mask" src="{{root}}assets/make-money/note-200.png" alt="" aria-hidden="true" data-group="n200" data-speed="1.6" data-rot="-8">

            <!-- Z-INDEX 2: Big Headline Text -->
            <h3 class="mm-big"><span class="mm-word">{{closeprojects.word1}}</span> <span class="mm-word">{{closeprojects.word2}}</span><span class="mm-big-sub">{{closeprojects.tagline}}</span></h3>

            <!-- ₹200 NOTE FRONT LAYER (Z-Index 3: Over text) -->
            <!-- 3. Front Blurred Copy (clipped) -->
            <img class="float note-200 n200-front-blur front-clip" src="{{root}}assets/make-money/note-200.png" alt="" aria-hidden="true" data-group="n200" data-speed="1.6" data-rot="-8">
            <!-- 4. Front Sharp Copy (clipped & masked to fade out left edge) -->
            <img class="float note-200 n200-front-sharp front-clip sharp-mask" src="{{root}}assets/make-money/note-200.png" alt="" aria-hidden="true" data-group="n200" data-speed="1.6" data-rot="-8">

            <!-- Z-INDEX 3: Front Coin (over "OJ") -->
            <img class="float coin coin-2 shadow-neutral" src="{{root}}assets/make-money/coin.png" alt="" aria-hidden="true" data-group="c2" data-speed="1.7" data-rot="14">

          </div>

          <!-- Subtitle (z-index: 4) -->
          <p class="mm-sub">{{closeprojects.sub}}</p>

          <!-- 4-Column Grid (z-index: 4) -->
          <div class="mm-grid">
{{#each closeprojects.points}}
            <div class="mm-item">
              <span class="mm-num">{{@num2}}</span>
              <p>{{.}}</p>
            </div>
{{/each}}
          </div>

        </section>
      </div>
    </section>
