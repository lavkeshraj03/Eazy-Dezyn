    <!-- ===== DARK GREEN METRICS / FEATURE SPECS BAR ===== -->
    <section class="metrics-spec-banner">
      <div class="container">
        <div class="metrics-spec-grid">
{{#each metrics}}
          <div class="metric-spec-item">
            <span class="metric-spec-label">{{label}}</span>
            <strong class="metric-spec-value">{{value}}</strong>
          </div>
{{/each}}
        </div>
      </div>
    </section>
