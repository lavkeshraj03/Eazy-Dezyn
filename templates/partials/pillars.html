    <!-- ===== 3-PILLAR SECTION (Bridging dark green and light mint) ===== -->
    <div class="pillars-section">
      <!-- Dedicated background layer — target .pillars-bg to adjust background height/padding independently -->
      <div class="pillars-bg"></div>

      <div class="pillars-container">
        <div class="pillars-card">
          <!-- Pillar 1: Excel + Google Sheets -->
          <div class="pillar-item">
            <div class="pillar-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="13" rx="2.5" />
                <line x1="12" y1="17" x2="12" y2="21" />
                <line x1="8" y1="21" x2="16" y2="21" />
              </svg>
            </div>
            <div class="pillar-text">
              <span class="pillar-label">{{pillars.0.label}}</span>
              <strong class="pillar-title">{{pillars.0.title}}</strong>
            </div>
          </div>

          <!-- Divider 1 -->
          <div class="pillar-divider"></div>

          <!-- Pillar 2: No Excel Skills Needed -->
          <div class="pillar-item">
            <div class="pillar-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="12" y1="3" x2="12" y2="21" />
                <polyline points="15 16 16.5 17.5 19 14.5" />
              </svg>
            </div>
            <div class="pillar-text">
              <span class="pillar-label">{{pillars.1.label}}</span>
              <strong class="pillar-title">{{pillars.1.title}}</strong>
            </div>
          </div>

          <!-- Divider 2 -->
          <div class="pillar-divider"></div>

          <!-- Pillar 3: Instant Access -->
          <div class="pillar-item">
            <div class="pillar-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12" />
                <polyline points="7 11 12 16 17 11" />
                <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
              </svg>
            </div>
            <div class="pillar-text">
              <span class="pillar-label">{{pillars.2.label}}</span>
              <strong class="pillar-title">{{pillars.2.title}}</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
