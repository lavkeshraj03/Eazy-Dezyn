    <!-- ===== WATCH IT WORK VIDEO SECTION ===== -->
    <section id="demo" class="learn-section">
      <div class="container text-center">
        <h2 class="section-title">{{demo.title}}</h2>
        <p class="section-sub">{{demo.sub}}</p>

        <!-- Video Box -->
        <div class="learn-video-wrap">
          <div class="learn-video-box">
            <img src="{{root}}{{demo.thumbnail}}" alt="{{demo.thumbnailAlt}}"
              class="learn-video-img" onerror="this.style.display='none'">
            <div class="learn-overlay"></div>
            <!-- Official YouTube Logo Play Button -->
            <button class="learn-play-btn yt-play-btn" id="learnPlayBtn" aria-label="{{demo.playLabel}}">
              <svg width="68" height="48" viewBox="0 0 68 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M66.52 7.74C65.74 4.83 63.45 2.54 60.54 1.76C55.27 0.33 34 0.33 34 0.33C34 0.33 12.73 0.33 7.46 1.76C4.55 2.54 2.26 4.83 1.48 7.74C0.05 13.01 0.05 24 0.05 24C0.05 24 0.05 34.99 1.48 40.26C2.26 43.17 4.55 45.46 7.46 46.24C12.73 47.67 34 47.67 34 47.67C34 47.67 55.27 47.67 60.54 46.24C63.45 45.46 65.74 43.17 66.52 40.26C67.95 34.99 67.95 24 67.95 24C67.95 24 67.95 13.01 66.52 7.74Z"
                  fill="#CC181E" />
                <path d="M45 24L27 14V34L45 24Z" fill="white" />
              </svg>
            </button>
          </div>
          <!-- Caption below video -->
        </div>

        <!-- 3 Step Pills Below Video (Exact match to reference screenshot) -->
{{#if demo.chips}}
        <div class="learn-steps-row learn-steps-row-2">
{{#each demo.chips}}
          <div class="learn-step-pill learn-step-pill-2">
            <span class="learn-step-num">{{@index1}}</span>
            <span class="learn-step-text learn-step-text-2">
              <span class="learn-step-label">{{label}}</span>
              <span class="learn-step-line">{{line}}</span>
            </span>
          </div>
{{#if @last}}
{{else}}

          <div class="learn-step-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A9488" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </div>
{{/if}}
{{/each}}
{{else}}
        <div class="learn-steps-row">
{{#each demo.steps}}
          <div class="learn-step-pill">
            <span class="learn-step-num">{{@index1}}</span>
            <span class="learn-step-text">{{.}}</span>
          </div>
{{#if @last}}
{{else}}

          <div class="learn-step-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A9488" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </div>
{{/if}}
{{/each}}
{{/if}}
        </div>
      </div>
    </section>
