    <!-- ===== FAQ ===== -->
    <section class="faq-section" id="faq">
      <!-- Watermark Bottom-Right using mark-white.png -->
      <div class="faq-watermark-br">
        <img src="{{root}}assets/mark-white.png" alt="" class="faq-watermark-img">
      </div>

      <div class="container faq-container">
        <div class="text-center faq-header-wrap">
          <h2 class="faq-headline">{{faq.title}}</h2>
        </div>
        <div class="faq-list" id="faqList">
{{#each faq.items}}
          <div class="faq-item{{#if @first}} open{{/if}}">
            <button class="faq-btn" aria-expanded="{{#if @first}}true{{else}}false{{/if}}">
              <span class="faq-q">{{q}}</span>
              <div class="faq-toggle">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2E8F6C" stroke-width="2.6"
                  stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </div>
            </button>
            <div class="faq-answer">
              <p>{{a}}</p>
            </div>
          </div>

{{/each}}
        </div>
      </div>
    </section>
