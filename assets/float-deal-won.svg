<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="dealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#dealShadow)" transform="rotate(-10 50 50)">
    <!-- Scalloped / Starburst Seal -->
    <circle cx="50" cy="50" r="38" fill="#144634" stroke="#FCD34D" stroke-width="2"/>
    <circle cx="50" cy="50" r="32" fill="#0E3326" stroke="#45B28D" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>

    <!-- Handshake / Checkmark Icon -->
    <path d="M42 50 L48 56 L60 42" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arch Text -->
    <text x="50" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="900" fill="#FCD34D" text-anchor="middle" letter-spacing="0.14em">PROJECT</text>
    <text x="50" y="69" font-family="'Clash Display', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.06em">CLOSED</text>
  </g>
</svg>
