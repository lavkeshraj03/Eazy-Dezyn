<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="postGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#EFF6F3"/>
      <stop offset="100%" stop-color="#E2ECE7"/>
    </linearGradient>

    <!-- Glass UI Widget Gradient -->
    <linearGradient id="widgetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F1F5F3" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="postShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Poster Base Container -->
  <rect width="540" height="380" rx="26" fill="url(#postGrad)"/>

  <!-- Subtle Blueprint Grid Pattern in Background -->
  <g opacity="0.15" stroke="#2E8F6C" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="380"/>
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="280" y1="0" x2="280" y2="380"/>
    <line x1="360" y1="0" x2="360" y2="380"/>
    <line x1="440" y1="0" x2="440" y2="380"/>
    <line x1="0" y1="60" x2="540" y2="60"/>
    <line x1="0" y1="140" x2="540" y2="140"/>
    <line x1="0" y1="220" x2="540" y2="220"/>
    <line x1="0" y1="300" x2="540" y2="300"/>
  </g>

  <!-- Top-Left Category Pill -->
  <g transform="translate(36, 34)" filter="url(#badgeShadow)">
    <rect width="112" height="28" rx="14" fill="#E6F4EA" stroke="#45B28D" stroke-width="1"/>
    <rect x="8" y="9" width="10" height="10" rx="2" fill="#2E8F6C"/>
    <text x="13" y="16.5" font-family="'Clash Display', sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">X</text>
    <text x="24" y="17.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" fill="#144634">Masterclass</text>
  </g>

  <!-- Big Bold Course Display Headline -->
  <text x="36" y="104" font-family="'Clash Display', sans-serif" font-size="34" font-weight="700" fill="#0E3B2E" letter-spacing="-0.03em">
    Quote Live &amp;
  </text>
  <text x="36" y="146" font-family="'Clash Display', sans-serif" font-size="34" font-weight="700" fill="#16593F" letter-spacing="-0.03em">
    Win Clients Fast
  </text>

  <!-- Duration Badge Tag -->
  <g transform="translate(36, 172)">
    <rect width="106" height="26" rx="6" fill="#FCD34D"/>
    <path d="M12 13 C12 9.5 14.5 7 18 7 C21.5 7 24 9.5 24 13 C24 16.5 21.5 19 18 19 C14.5 19 12 16.5 12 13 Z" fill="#92400E" opacity="0.2"/>
    <circle cx="18" cy="13" r="5" stroke="#78350F" stroke-width="1.2" fill="none"/>
    <polyline points="18 10 18 13 20 14" stroke="#78350F" stroke-width="1.2" stroke-linecap="round"/>
    <text x="28" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#78350F">2.5+ Hours</text>
  </g>

  <!-- Floating UI Widget 1: Live Estimate Meter (Top Right) -->
  <g transform="translate(320, 28)" filter="url(#postShadow)">
    <rect width="184" height="96" rx="16" fill="url(#widgetGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="12" fill="#E6F4EA"/>
    <text x="28" y="32" font-family="'Clash Display', sans-serif" font-size="12" font-weight="700" fill="#2E8F6C" text-anchor="middle">₹</text>
    <text x="48" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" fill="#14362B">Initial Estimate</text>
    <text x="48" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#8CA096">456 Formulas Auto</text>

    <!-- Calculation Bar -->
    <rect x="18" y="52" width="148" height="6" rx="3" fill="#E2ECE7"/>
    <rect x="18" y="52" width="124" height="6" rx="3" fill="#45B28D"/>
    
    <text x="18" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#8CA096">CLIENT READY</text>
    <text x="166" y="76" font-family="'Clash Display', sans-serif" font-size="10" font-weight="700" fill="#0E3B2E" text-anchor="end">₹18.4L ✓</text>
  </g>

  <!-- Floating UI Widget 2: 3D Room Breakdown (Right-Mid) -->
  <g transform="translate(330, 140)" filter="url(#postShadow)">
    <rect width="174" height="88" rx="16" fill="url(#widgetGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="18" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#0E3B2E">Room-by-Room Grade</text>
    
    <g transform="translate(18, 34)">
      <rect width="66" height="18" rx="4" fill="#E6F4EA"/>
      <text x="8" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="700" fill="#16593F">Living: Premium</text>
    </g>
    <g transform="translate(90, 34)">
      <rect width="66" height="18" rx="4" fill="#EFF6F3"/>
      <text x="8" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="700" fill="#6B7280">Kitchen: Luxury</text>
    </g>

    <g transform="translate(18, 58)">
      <rect width="138" height="18" rx="4" fill="#FEF3C7"/>
      <text x="8" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#92400E">GST &amp; Designer Fee: Included</text>
    </g>
  </g>

  <!-- Floating UI Widget 3: Accuracy Score (Far Right Circle) -->
  <g transform="translate(436, 246)" filter="url(#badgeShadow)">
    <circle cx="36" cy="36" r="32" fill="#FFFFFF" stroke="#45B28D" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="26" fill="#E6F4EA"/>
    <text x="36" y="35" font-family="'Clash Display', sans-serif" font-size="14" font-weight="700" fill="#144634" text-anchor="middle">98%</text>
    <text x="36" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="800" fill="#2E8F6C" text-anchor="middle">Accuracy</text>
  </g>

  <!-- Instructor Persona Watermark / Silhouette / Signature Brand -->
  <g transform="translate(230, 240)">
    <rect x="0" y="0" width="180" height="96" rx="14" fill="#0E3B2E" opacity="0.95"/>
    <circle cx="32" cy="48" r="18" fill="#45B28D"/>
    <text x="32" y="53" font-family="'Clash Display', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">SA</text>
    <text x="60" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">Siya Agrawal</text>
    <text x="60" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#A7F3D0">eazydezyn.com</text>
    <text x="60" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="700" fill="#FCD34D">★ 4.93 (2,300+ Reviews)</text>
  </g>
</svg>
