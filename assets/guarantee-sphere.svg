<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- 3D Sphere Radial Lighting -->
    <radialGradient id="sphereGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFF7C2"/>
      <stop offset="25%" stop-color="#FFDD6B"/>
      <stop offset="55%" stop-color="#F5B940"/>
      <stop offset="85%" stop-color="#D99418"/>
      <stop offset="100%" stop-color="#A86804"/>
    </radialGradient>

    <!-- Top Specular Highlight -->
    <radialGradient id="topGleam" cx="38%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FFF1A8" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Bevel / Rim Lighting -->
    <linearGradient id="sphereRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#F5B940" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#704400" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Ambient Floating Drop Shadow -->
    <filter id="sphereShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#B4730A" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#sphereShadow)">
    <!-- Main 3D Sphere Body -->
    <circle cx="80" cy="74" r="56" fill="url(#sphereGrad)"/>
    
    <!-- Top Sphere Specular Highlight -->
    <ellipse cx="74" cy="46" rx="34" ry="22" fill="url(#topGleam)"/>

    <!-- Subtle Outer Bevel Rim -->
    <circle cx="80" cy="74" r="55" fill="none" stroke="url(#sphereRim)" stroke-width="1.8"/>

    <!-- Clean Typography -->
    <!-- 100% -->
    <text x="80" y="70" font-family="'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="25" fill="#2C1B03" text-anchor="middle" letter-spacing="-0.5">100%</text>
    
    <!-- MONEY BACK -->
    <text x="80" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="6.8" fill="#3D2805" text-anchor="middle" letter-spacing="1.2">MONEY BACK</text>
    
    <!-- GUARANTEE -->
    <text x="80" y="91" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="6.8" fill="#3D2805" text-anchor="middle" letter-spacing="1.2">GUARANTEE</text>
  </g>
</svg>
