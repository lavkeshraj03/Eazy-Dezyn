<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <filter id="fanShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="note500" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F1EC"/>
      <stop offset="100%" stop-color="#A5BEB1"/>
    </linearGradient>
    <linearGradient id="note200" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8D2"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="note100" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="note50" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <g filter="url(#fanShadow)">
    <!-- Note 1: ₹50 (Bottom Left, rotated -35 deg) -->
    <g transform="translate(120, 150) rotate(-38)">
      <rect x="-45" y="-95" width="90" height="52" rx="4" fill="url(#note50)" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="-35" y="-60" font-family="sans-serif" font-weight="900" font-size="14" fill="#0369A1">₹50</text>
      <circle cx="20" cy="-68" r="12" fill="#0284C7" opacity="0.2"/>
    </g>

    <!-- Note 2: ₹100 (rotated -18 deg) -->
    <g transform="translate(120, 150) rotate(-20)">
      <rect x="-45" y="-102" width="90" height="54" rx="4" fill="url(#note100)" stroke="#A78BFA" stroke-width="1.2"/>
      <text x="-35" y="-65" font-family="sans-serif" font-weight="900" font-size="14" fill="#6D28D9">₹100</text>
      <circle cx="20" cy="-75" r="13" fill="#7C3AED" opacity="0.2"/>
    </g>

    <!-- Note 3: ₹200 (rotated 2 deg) -->
    <g transform="translate(120, 150) rotate(2)">
      <rect x="-45" y="-108" width="90" height="56" rx="4" fill="url(#note200)" stroke="#FB923C" stroke-width="1.2"/>
      <text x="-35" y="-70" font-family="sans-serif" font-weight="900" font-size="15" fill="#C2410C">₹200</text>
      <circle cx="20" cy="-80" r="14" fill="#EA580C" opacity="0.2"/>
    </g>

    <!-- Note 4: ₹500 (Top, rotated 24 deg) -->
    <g transform="translate(120, 150) rotate(24)">
      <rect x="-45" y="-115" width="90" height="58" rx="4" fill="url(#note500)" stroke="#688474" stroke-width="1.2"/>
      <text x="-35" y="-75" font-family="sans-serif" font-weight="900" font-size="16" fill="#1E3A2B">₹500</text>
      <circle cx="20" cy="-86" r="15" fill="#2E4839" opacity="0.22"/>
      <line x1="-5" y1="-115" x2="-5" y2="-57" stroke="#10B981" stroke-width="2" stroke-dasharray="4,2"/>
    </g>
  </g>
</svg>
