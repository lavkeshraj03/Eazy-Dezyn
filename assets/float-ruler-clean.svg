<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 40" fill="none">
  <defs>
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A47"/>
      <stop offset="100%" stop-color="#14362B"/>
    </linearGradient>
    <filter id="rulerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#rulerShadow)" transform="rotate(-15 70 20)">
    <!-- Scale Ruler Body -->
    <rect x="10" y="8" width="120" height="24" rx="4" fill="url(#rulerGrad)" stroke="#45B28D" stroke-width="1.2" stroke-opacity="0.6"/>
    
    <!-- Measurement Scale Ticks -->
    <line x1="20" y1="8" x2="20" y2="20" stroke="#A7F3D0" stroke-width="1.2"/>
    <line x1="30" y1="8" x2="30" y2="14" stroke="#8CA096" stroke-width="1"/>
    <line x1="40" y1="8" x2="40" y2="18" stroke="#A7F3D0" stroke-width="1.2"/>
    <line x1="50" y1="8" x2="50" y2="14" stroke="#8CA096" stroke-width="1"/>
    <line x1="60" y1="8" x2="60" y2="20" stroke="#A7F3D0" stroke-width="1.2"/>
    <line x1="70" y1="8" x2="70" y2="14" stroke="#8CA096" stroke-width="1"/>
    <line x1="80" y1="8" x2="80" y2="18" stroke="#A7F3D0" stroke-width="1.2"/>
    <line x1="90" y1="8" x2="90" y2="14" stroke="#8CA096" stroke-width="1"/>
    <line x1="100" y1="8" x2="100" y2="20" stroke="#A7F3D0" stroke-width="1.2"/>
    <line x1="110" y1="8" x2="110" y2="14" stroke="#8CA096" stroke-width="1"/>
    <line x1="120" y1="8" x2="120" y2="18" stroke="#A7F3D0" stroke-width="1.2"/>

    <!-- Numbers -->
    <text x="20" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#A7F3D0" text-anchor="middle">0</text>
    <text x="60" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#A7F3D0" text-anchor="middle">10</text>
    <text x="100" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#A7F3D0" text-anchor="middle">20</text>
  </g>
</svg>
