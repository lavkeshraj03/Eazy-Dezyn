<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" fill="none">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#docShadow)" transform="rotate(7 90 100)">
    <!-- Clipboard Wooden Base -->
    <rect x="25" y="20" width="130" height="160" rx="10" fill="url(#boardGrad)" stroke="#B45309" stroke-width="1.5" />
    
    <!-- White Paper Sheet -->
    <rect x="35" y="36" width="110" height="134" rx="4" fill="#FFFFFF" />
    
    <!-- Blueprint / Floor Plan Lines on Paper -->
    <rect x="45" y="50" width="90" height="46" rx="2" fill="#F0FDF4" stroke="#10B981" stroke-width="1" stroke-dasharray="3,2" />
    <!-- Room partitions -->
    <line x1="75" y1="50" x2="75" y2="96" stroke="#059669" stroke-width="1.5" />
    <line x1="75" y1="72" x2="135" y2="72" stroke="#059669" stroke-width="1.5" />
    <!-- Living Room, Kitchen text indicator -->
    <rect x="48" y="54" width="22" height="6" rx="1" fill="#34D399" opacity="0.6" />
    <rect x="80" y="54" width="28" height="6" rx="1" fill="#34D399" opacity="0.6" />
    
    <!-- Estimate Line Items -->
    <line x1="45" y1="108" x2="115" y2="108" stroke="#047857" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="120" x2="135" y2="120" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" />
    <line x1="45" y1="130" x2="125" y2="130" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round" />
    
    <!-- Approved Stamp -->
    <rect x="85" y="136" width="52" height="22" rx="4" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" transform="rotate(-8 111 147)" />
    <text x="111" y="151" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#15803D" text-anchor="middle" transform="rotate(-8 111 151)">APPROVED</text>
    
    <!-- Metallic Clip Top -->
    <rect x="62" y="12" width="56" height="20" rx="4" fill="#FCD34D" stroke="#D97706" stroke-width="1.5" />
    <circle cx="90" cy="20" r="4" fill="#78350F" />
  </g>
</svg>
