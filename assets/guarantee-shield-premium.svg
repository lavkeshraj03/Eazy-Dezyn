<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Background Shield Glow -->
    <radialGradient id="shieldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#45B28D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#45B28D" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Metallic Emerald-Gold Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="40%" stop-color="#45B28D"/>
      <stop offset="80%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="shieldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#164A38"/>
      <stop offset="100%" stop-color="#0B261D"/>
    </linearGradient>
    
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#45B28D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="100" cy="100" r="95" fill="url(#shieldAura)"/>

  <g filter="url(#shieldShadow)">
    <!-- Outer Bezel Ring -->
    <circle cx="100" cy="100" r="82" fill="#0B261D" stroke="url(#ringGrad)" stroke-width="2.5"/>
    
    <!-- Dashed Precision Ring -->
    <circle cx="100" cy="100" r="74" fill="none" stroke="#45B28D" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Inner Shield Shape -->
    <path d="M100 42 L138 58 C138 98 120 134 100 148 C80 134 62 98 62 58 Z" fill="url(#shieldFace)" stroke="#45B28D" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Central 100% Value -->
    <text x="100" y="86" font-family="'Clash Display', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.02em">100%</text>
    
    <!-- Micro Badge Text -->
    <text x="100" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#A7F3D0" text-anchor="middle" letter-spacing="0.16em">MONEY BACK</text>
    <text x="100" y="113" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#6EE7B7" text-anchor="middle" letter-spacing="0.14em">GUARANTEE</text>

    <!-- Star Cluster Bottom -->
    <g transform="translate(100, 126)" fill="#FCD34D">
      <path d="M0 -4 L1 -1 L4 -1 L1.5 1 L2.5 4 L0 2 L-2.5 4 L-1.5 1 L-4 -1 L-1 -1 Z" transform="scale(0.9)"/>
      <path d="M-10 -3 L-9 -1 L-7 -1 L-8.5 0.5 L-8 2.5 L-10 1.2 L-12 2.5 L-11.5 0.5 L-13 -1 L-11 -1 Z" transform="scale(0.75)" opacity="0.85"/>
      <path d="M10 -3 L11 -1 L13 -1 L11.5 0.5 L12 2.5 L10 1.2 L8 2.5 L8.5 0.5 L7 -1 L9 -1 Z" transform="scale(0.75)" opacity="0.85"/>
    </g>
  </g>
</svg>
