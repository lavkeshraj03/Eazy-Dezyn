<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <defs>
    <filter id="invShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#invShadow)" transform="rotate(-8 50 60)">
    <!-- Document Base -->
    <rect x="15" y="12" width="70" height="96" rx="4" fill="#163E30" stroke="#45B28D" stroke-width="1.2" stroke-opacity="0.5"/>
    
    <!-- Header -->
    <rect x="22" y="20" width="28" height="6" rx="2" fill="#45B28D" opacity="0.8"/>
    <rect x="62" y="20" width="16" height="4" rx="1" fill="#8CA096" opacity="0.5"/>

    <!-- Table Lines -->
    <line x1="22" y1="36" x2="78" y2="36" stroke="#45B28D" stroke-width="1" opacity="0.6"/>
    
    <!-- Rows -->
    <line x1="22" y1="48" x2="78" y2="48" stroke="#8CA096" stroke-width="0.8" opacity="0.3"/>
    <line x1="22" y1="60" x2="78" y2="60" stroke="#8CA096" stroke-width="0.8" opacity="0.3"/>
    <line x1="22" y1="72" x2="78" y2="72" stroke="#8CA096" stroke-width="0.8" opacity="0.3"/>
    
    <!-- Total box -->
    <rect x="52" y="84" width="26" height="12" rx="2" fill="#0E2E23" stroke="#45B28D" stroke-width="0.8"/>
    <text x="65" y="93" font-family="'Clash Display', sans-serif" font-size="8" font-weight="700" fill="#A7F3D0" text-anchor="middle">PAID</text>
  </g>
</svg>
