<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bookSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="pageStack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#bookShadow)" transform="rotate(-8 100 110)">
    <!-- Back Cover Shadow -->
    <path d="M40 38 L160 22 L172 172 L52 188 Z" fill="#064E3B" opacity="0.6" />
    
    <!-- Pages Thickness -->
    <path d="M160 22 L170 32 L170 182 L160 172 Z" fill="url(#pageStack)" stroke="#E5E7EB" stroke-width="0.5" />
    <path d="M52 188 L160 172 L170 182 L62 198 Z" fill="url(#pageStack)" stroke="#E5E7EB" stroke-width="0.5" />
    
    <!-- Spine -->
    <path d="M30 46 L40 38 L52 188 L42 196 Z" fill="url(#bookSpine)" />
    
    <!-- Front Cover -->
    <path d="M40 38 L160 22 L150 170 L30 186 Z" fill="url(#bookCover)" stroke="#34D399" stroke-width="1.5" />
    
    <!-- Cover Title & Decoration -->
    <!-- Gold Ribbon / Badge -->
    <path d="M120 27 L132 25 L130 85 L126 80 L122 85 Z" fill="#F59E0B" />
    <circle cx="90" cy="85" r="24" fill="#047857" stroke="#6EE7B7" stroke-width="1.5" />
    
    <!-- Rupee / Estimate Symbol -->
    <text x="90" y="93" font-family="'Clash Display', 'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" fill="#FDE047" text-anchor="middle">₹</text>
    
    <text x="90" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">INITIAL</text>
    <text x="90" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="0.5">ESTIMATE</text>
    
    <!-- Corner Metallic Accents -->
    <path d="M40 38 L55 36 L40 51 Z" fill="#FCD34D" opacity="0.8" />
    <path d="M160 22 L145 24 L160 37 Z" fill="#FCD34D" opacity="0.8" />
  </g>
</svg>
