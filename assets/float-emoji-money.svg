<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- 3D Sphere Radial Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <linearGradient id="tongueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="emojiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#D97706" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#emojiGlow)">
    <!-- 3D Head Sphere -->
    <circle cx="80" cy="80" r="68" fill="url(#sphereGrad)" />
    
    <!-- Specular Highlight Top Left -->
    <ellipse cx="55" cy="45" rx="20" ry="12" fill="#FFFFFF" opacity="0.45" transform="rotate(-30 55 45)" />

    <!-- Currency Eyes (₹ signs) -->
    <!-- Left Eye -->
    <g transform="translate(48, 55)">
      <text x="0" y="16" font-family="'Clash Display', 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#047857" text-anchor="middle">₹</text>
    </g>
    <!-- Right Eye -->
    <g transform="translate(112, 55)">
      <text x="0" y="16" font-family="'Clash Display', 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#047857" text-anchor="middle">₹</text>
    </g>

    <!-- Eyebrows Raised with Excitement -->
    <path d="M36 42 Q50 34 62 40" stroke="#78350F" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M98 40 Q110 34 124 42" stroke="#78350F" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Big Open Grin Mouth -->
    <path d="M46 95 Q80 128 114 95 Z" fill="#78350F" />

    <!-- Green Money Bill Tongue sticking out -->
    <g transform="translate(0, 0)">
      <path d="M64 100 Q80 98 96 100 L93 134 Q80 144 67 134 Z" fill="url(#tongueGrad)" stroke="#047857" stroke-width="1.5" />
      <!-- Tongue Crease / Line -->
      <path d="M80 102 L80 134" stroke="#047857" stroke-width="2" stroke-linecap="round" />
      <text x="80" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ECFDF5" text-anchor="middle">₹</text>
    </g>
  </g>
</svg>
