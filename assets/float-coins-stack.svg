<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#B45309" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="goldTop" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="10" y1="50" x2="90" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <g filter="url(#coinGlow)">
    <!-- Base coin shadow/rim -->
    <path d="M15,48 C15,35 30,25 50,25 C70,25 85,35 85,48 L85,58 C85,71 70,81 50,81 C30,81 15,71 15,58 Z" fill="url(#goldRim)"/>
    
    <!-- Top Face -->
    <ellipse cx="50" cy="48" rx="34" ry="21" fill="url(#goldTop)"/>
    <!-- Inner Rim -->
    <ellipse cx="50" cy="48" rx="28" ry="16" fill="none" stroke="#FEF3C7" stroke-width="1.8" stroke-dasharray="3 2"/>
    
    <!-- Rupee symbol in 3D perspective -->
    <text x="50" y="55" font-family="'Poppins', sans-serif" font-weight="900" font-size="22" fill="#78350F" text-anchor="middle" transform="rotate(-5, 50, 48) scale(1, 0.75)">₹</text>
  </g>
</svg>
