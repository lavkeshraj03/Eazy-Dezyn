<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" fill="none">
  <defs>
    <linearGradient id="bill3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4D3D" />
      <stop offset="50%" stop-color="#123B2E" />
      <stop offset="100%" stop-color="#0B261D" />
    </linearGradient>
    <filter id="bill3dShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#bill3dShadow)">
    <!-- Curled 3D Banknote Contour -->
    <path d="M12 20 Q80 8 148 24 Q138 74 130 80 Q65 64 8 72 Z" fill="url(#bill3d)" stroke="#45B28D" stroke-width="1.4" stroke-opacity="0.5" />
    <path d="M18 24 Q80 14 142 28 Q134 68 126 74 Q65 58 14 66 Z" fill="none" stroke="#8CA096" stroke-width="0.8" stroke-dasharray="2.5,2" opacity="0.5" />
    
    <!-- Central Vignette -->
    <ellipse cx="78" cy="46" rx="20" ry="14" transform="rotate(-4 78 46)" fill="#0E3327" stroke="#45B28D" stroke-width="1" stroke-opacity="0.6" />
    <text x="78" y="52" font-family="'Clash Display', sans-serif" font-size="16" font-weight="700" fill="#A7F3D0" text-anchor="middle" transform="rotate(-4 78 52)">₹500</text>
    
    <!-- Denomination numbers -->
    <text x="26" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#8CA096" opacity="0.6">₹</text>
    <text x="124" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#8CA096" opacity="0.6">₹</text>
  </g>
</svg>
