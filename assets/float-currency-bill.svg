<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" fill="none">
  <defs>
    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="billBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="billShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <g filter="url(#billShadow)">
    <!-- Curled 3D Banknote Body -->
    <path d="M15 25 Q130 5 245 35 Q230 115 220 125 Q110 95 10 110 Z" fill="url(#billGrad)" stroke="url(#billBorder)" stroke-width="2.5" />
    
    <!-- Inner Guilloche Border -->
    <path d="M25 33 Q130 15 235 43 Q222 108 212 116 Q110 88 20 102 Z" fill="none" stroke="#A7F3D0" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.8" />
    
    <!-- Central Vignette Circle -->
    <ellipse cx="125" cy="65" rx="36" ry="24" transform="rotate(-6 125 65)" fill="#065F46" stroke="#6EE7B7" stroke-width="1.5" />
    
    <!-- Rupee Sign Center -->
    <text x="125" y="73" font-family="'Clash Display', 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#ECFDF5" text-anchor="middle" transform="rotate(-6 125 73)">₹500</text>
    
    <!-- Corner Denominations -->
    <text x="36" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#A7F3D0" transform="rotate(-6 36 52)">₹</text>
    <text x="214" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#A7F3D0" transform="rotate(-6 214 62)">₹</text>
    <text x="28" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#A7F3D0" transform="rotate(-6 28 98)">500</text>
    <text x="202" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#A7F3D0" transform="rotate(-6 202 108)">500</text>
    
    <!-- Security Thread -->
    <path d="M85 20 Q88 65 80 104" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6,4" opacity="0.85" />
  </g>
</svg>
