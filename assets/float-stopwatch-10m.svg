<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">
  <defs>
    <filter id="timerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#timerShadow)">
    <!-- Top Crown Button -->
    <rect x="46" y="10" width="8" height="8" rx="2" fill="#FCD34D"/>
    <line x1="50" y1="18" x2="50" y2="24" stroke="#FCD34D" stroke-width="2"/>

    <!-- Clock Outer Dial -->
    <circle cx="50" cy="62" r="38" fill="#12382C" stroke="#45B28D" stroke-width="2"/>
    <circle cx="50" cy="62" r="32" fill="#0A2219" stroke="#45B28D" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>

    <!-- 10 MIN Text -->
    <text x="50" y="58" font-family="'Clash Display', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">10m</text>
    <text x="50" y="69" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="800" fill="#A7F3D0" text-anchor="middle" letter-spacing="0.1em">LIVE QUOTE</text>
    
    <!-- Clock Hand Accent -->
    <line x1="50" y1="62" x2="68" y2="46" stroke="#FF7A59" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="50" cy="62" r="2.5" fill="#FF7A59"/>
  </g>
</svg>
