<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 120" fill="none">
  <defs>
    <filter id="docCleanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#docCleanShadow)" transform="rotate(6 55 60)">
    <!-- Architectural Clipboard Base -->
    <rect x="15" y="14" width="80" height="96" rx="6" fill="#14362B" stroke="#45B28D" stroke-width="1.2" stroke-opacity="0.4" />
    
    <!-- Paper Sheet -->
    <rect x="22" y="24" width="66" height="78" rx="3" fill="#1B4235" stroke="#8CA096" stroke-width="0.8" stroke-opacity="0.3" />
    
    <!-- Blueprint Room Lines -->
    <rect x="28" y="32" width="54" height="30" rx="2" fill="#122E24" stroke="#45B28D" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2,2" />
    <line x1="48" y1="32" x2="48" y2="62" stroke="#45B28D" stroke-width="1" stroke-opacity="0.45" />
    <line x1="48" y1="46" x2="82" y2="46" stroke="#45B28D" stroke-width="1" stroke-opacity="0.45" />
    
    <!-- Estimate Lines -->
    <line x1="28" y1="70" x2="72" y2="70" stroke="#8CA096" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="28" y1="78" x2="60" y2="78" stroke="#8CA096" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    
    <!-- Metallic Top Clip -->
    <rect x="42" y="10" width="26" height="10" rx="2.5" fill="#FCD34D" stroke="#D97706" stroke-width="0.8" />
  </g>
</svg>
