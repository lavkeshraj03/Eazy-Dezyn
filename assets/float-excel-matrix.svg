<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <filter id="xlsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#xlsShadow)" transform="rotate(8 60 60)">
    <!-- Sheet Base -->
    <rect x="14" y="14" width="92" height="92" rx="8" fill="#0E2F23" stroke="#45B28D" stroke-width="1.3"/>
    
    <!-- Excel Header Bar -->
    <rect x="14" y="14" width="92" height="22" rx="8" fill="#18563E"/>
    <rect x="22" y="20" width="10" height="10" rx="2" fill="#2E8F6C"/>
    <text x="27" y="27.5" font-family="'Clash Display', sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">X</text>
    <text x="36" y="27.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#A7F3D0">INITIAL_EST.xlsx</text>

    <!-- Spreadsheet Formula Grid -->
    <line x1="14" y1="48" x2="106" y2="48" stroke="#45B28D" stroke-width="0.7" opacity="0.3"/>
    <line x1="14" y1="64" x2="106" y2="64" stroke="#45B28D" stroke-width="0.7" opacity="0.3"/>
    <line x1="14" y1="80" x2="106" y2="80" stroke="#45B28D" stroke-width="0.7" opacity="0.3"/>

    <!-- Vertical Column divider -->
    <line x1="58" y1="36" x2="58" y2="106" stroke="#45B28D" stroke-width="0.7" opacity="0.3"/>

    <!-- Cell contents -->
    <text x="20" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="700" fill="#8CA096">MODULAR KITCHEN</text>
    <text x="100" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="700" fill="#FFFFFF" text-anchor="end">=SUM(RATE*AREA)</text>

    <text x="20" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="700" fill="#8CA096">FALSE CEILING</text>
    <text x="100" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="700" fill="#FFFFFF" text-anchor="end">₹185/sq.ft</text>

    <text x="20" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="700" fill="#8CA096">CIVIL &amp; FLOORING</text>
    <text x="100" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="700" fill="#FFFFFF" text-anchor="end">456 FORMULAS ✓</text>

    <!-- Formula Function Badge -->
    <rect x="20" y="88" width="76" height="12" rx="3" fill="#0A2219" stroke="#45B28D" stroke-width="0.8"/>
    <text x="24" y="96.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="800" fill="#45B28D">fx</text>
    <text x="34" y="96.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="600" fill="#A7F3D0">=AUTO_ESTIMATE(BHK)</text>
  </g>
</svg>
