<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="starSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#D97706" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#starGlow)">
    <!-- 3D Sphere -->
    <circle cx="80" cy="80" r="68" fill="url(#starSphere)" />
    
    <!-- Specular Highlight -->
    <ellipse cx="55" cy="45" rx="18" ry="10" fill="#FFFFFF" opacity="0.45" transform="rotate(-30 55 45)" />

    <!-- Star Eyes (Glowing Green/Gold Stars) -->
    <polygon points="50,42 54,53 66,54 57,62 60,73 50,67 40,73 43,62 34,54 46,53" fill="#047857" stroke="#34D399" stroke-width="1.5" />
    <polygon points="110,42 114,53 126,54 117,62 120,73 110,67 100,73 103,62 94,54 106,53" fill="#047857" stroke="#34D399" stroke-width="1.5" />

    <!-- Joyful Wide Smile -->
    <path d="M42 90 Q80 134 118 90 Q80 102 42 90 Z" fill="#78350F" />
    <!-- White Sparkling Teeth -->
    <path d="M50 93 Q80 104 110 93 Q80 97 50 93 Z" fill="#FFFFFF" />

    <!-- Rosy Cheeks -->
    <ellipse cx="36" cy="84" rx="12" ry="7" fill="#F87171" opacity="0.55" />
    <ellipse cx="124" cy="84" rx="12" ry="7" fill="#F87171" opacity="0.55" />
  </g>
</svg>
