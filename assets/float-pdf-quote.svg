<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 130" fill="none">
  <defs>
    <filter id="pdfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="pdfCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143E30"/>
      <stop offset="100%" stop-color="#0B261D"/>
    </linearGradient>
  </defs>

  <g filter="url(#pdfShadow)" transform="rotate(-6 55 65)">
    <!-- Document Base -->
    <rect x="12" y="10" width="86" height="110" rx="7" fill="url(#pdfCover)" stroke="#45B28D" stroke-width="1.4" stroke-opacity="0.7"/>
    
    <!-- Top Bar with Red/Coral PDF Tag -->
    <rect x="20" y="18" width="26" height="10" rx="3" fill="#FF7A59"/>
    <text x="33" y="25.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">PDF</text>
    
    <!-- Title Text -->
    <text x="20" y="40" font-family="'Clash Display', sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">QUOTATION</text>
    <text x="20" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="600" fill="#A7F3D0" opacity="0.85">3BHK • PREMIUM GRADE</text>

    <!-- Estimate Line Items -->
    <line x1="20" y1="56" x2="90" y2="56" stroke="#45B28D" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Rows -->
    <circle cx="24" cy="66" r="2.5" fill="#45B28D"/>
    <rect x="30" y="64" width="36" height="4" rx="1.5" fill="#8CA096" opacity="0.5"/>
    <text x="88" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#FFFFFF" text-anchor="end">₹4.2L</text>

    <circle cx="24" cy="77" r="2.5" fill="#45B28D"/>
    <rect x="30" y="75" width="28" height="4" rx="1.5" fill="#8CA096" opacity="0.5"/>
    <text x="88" y="79" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#FFFFFF" text-anchor="end">₹6.8L</text>

    <!-- Total Highlight Box -->
    <rect x="18" y="90" width="74" height="20" rx="4" fill="#0A2219" stroke="#45B28D" stroke-width="1"/>
    <text x="24" y="103" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#8CA096">TOTAL EST.</text>
    <text x="86" y="104" font-family="'Clash Display', sans-serif" font-size="9" font-weight="700" fill="#A7F3D0" text-anchor="end">₹18.4 Lakh</text>
  </g>
</svg>
